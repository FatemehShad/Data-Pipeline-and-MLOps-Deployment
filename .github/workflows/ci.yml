name: Validate and build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv run sales-mlops pipeline && uv run sales-mlops train
      - run: docker compose up --build -d --wait api
      - name: Verify container prediction
        run: |
          curl --fail --retry 10 --retry-delay 3 http://localhost:8000/ready
          curl --fail -H 'Content-Type: application/json' -d '{"units":3,"unit_price":20,"category":"home"}' http://localhost:8000/predict
      - if: always()
        run: docker compose logs && docker compose down -v
