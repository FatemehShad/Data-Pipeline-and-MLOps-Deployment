[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "sales-mlops"
version = "0.1.0"
description = "Validated sales pipeline, MLflow registry, and monitored forecasting API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pandas==2.2.3", "scikit-learn==1.6.1", "mlflow==3.1.4",
  "fastapi==0.115.12", "uvicorn==0.34.2", "prometheus-client==0.21.1",
  "boto3==1.38.23", "sqlalchemy==2.0.41"
]

[dependency-groups]
dev = ["pytest==8.3.5", "httpx==0.28.1", "ruff==0.11.11", "pyyaml==6.0.2"]

[project.scripts]
sales-mlops = "sales_mlops.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
